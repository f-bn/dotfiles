---
zsh:
  theme: gentoo
  plugins:
    - command-not-found
    - docker
    - extract
    - fzf
    - git
    - helm
    - kubectl
    - mise
    - uv
    - zoxide
    - zsh-autosuggestions
  aliases:
    bwlogin: export BW_SESSION="$(bw login --raw)"
    bwunlock: export BW_SESSION="$(bw unlock --raw)"
    docker-prune: sh -c "docker system prune --all --volumes --force ; docker builder prune --all --force"
    ghtoken: export GITHUB_TOKEN="$(bw get password 278887eb-97b2-4fb3-8d32-b38c013096d2)"
    sysupdate: sudo sh -c "dnf upgrade -y && flatpak upgrade -y"
    zj: zellij
  environment:
    PATH: $PATH:$HOME/.local/bin
    EDITOR: vim
  extra_configurations:
    ZOXIDE_CMD_OVERRIDE: "cd"
