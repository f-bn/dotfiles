---
zed:
  settings:
    icon_theme: JetBrains Icons Dark
    ui_font_family: .ZedSans
    ui_font_size: 16.0
    agent_ui_font_size: 16.0
    agent_buffer_font_size: 15.0
    buffer_line_height: standard
    buffer_font_family: Cascadia Mono
    buffer_font_size: 16.0
    project_panel:
      dock: left
    theme:
      mode: dark
      light: One Light
      dark: One Dark Pro
    git_panel:
      group_by: status
      tree_view: true
    auto_install_extensions:
      csv: true
      docker-compose: true
      dockerfile: true
      html: true
      ini: true
      jetbrains-icons: true
      one-dark-pro: true
      sql: true
      terraform: true
      toml: true
      xml: true
    format_on_save: off
    close_on_file_delete: true
    ensure_final_newline_on_save: false
    agent:
      dock: right
      sidebar_side: right
      default_model:
        provider: deepseek
        model: deepseek-v4-flash
    language_models:
      openai_compatible:
        Qwen:
          api_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
          available_models:
            - name: qwen3.7-max
              display_name: "Qwen 3.7 Max"
              max_tokens: 1000000
              max_output_tokens: 131000
              max_completion_tokens: 16384
              reasoning_effort: high
              capabilities:
                tools: true
                images: false
                parallel_tool_calls: true
                prompt_cache_key: false
                chat_completions: true
                interleaved_reasoning: false
                max_tokens_parameter: false
            - name: qwen3.7-plus
              display_name: "Qwen 3.7 Plus"
              max_tokens: 1000000
              max_output_tokens: 131000
              max_completion_tokens: 16384
              reasoning_effort: high
              capabilities:
                tools: true
                images: true
                parallel_tool_calls: true
                prompt_cache_key: false
                chat_completions: true
                interleaved_reasoning: false
                max_tokens_parameter: false
            - name: qwen3.7-flash
              display_name: "Qwen 3.7 Flash"
              max_tokens: 1000000
              max_output_tokens: 131000
              max_completion_tokens: 16384
              reasoning_effort: high
              capabilities:
                tools: true
                images: true
                parallel_tool_calls: true
                prompt_cache_key: false
                chat_completions: true
                interleaved_reasoning: false
                max_tokens_parameter: false