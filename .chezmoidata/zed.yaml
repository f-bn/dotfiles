---
zed:
  settings:
    icon_theme: Colored Zed Icons Theme Dark
    ui_font_family: .ZedSans
    ui_font_size: 16.0
    agent_ui_font_size: 16.0
    agent_buffer_font_size: 15.0
    buffer_line_height: standard
    buffer_font_family: Cascadia Mono
    buffer_font_size: 16.0
    agent:
      dock: right
      sidebar_side: right
      default_model:
        provider: deepseek
        model: deepseek-v4-flash
    project_panel:
      dock: left
    theme:
      mode: dark
      light: One Light
      dark: One Dark Pro
    auto_install_extensions:
      ansible: true
      colored-zed-icons-theme: true
      csv: true
      docker-compose: true
      dockerfile: true
      html: true
      ini: true
      one-dark-pro: true
      sql: true
      terraform: true
      toml: true
      xml: true
    format_on_save: off
    close_on_file_delete: true
    ensure_final_newline_on_save: false